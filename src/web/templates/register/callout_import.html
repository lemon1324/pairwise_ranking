{#
  Import a project file from the desktop app.

  A fragment for `#row-callout`, hung on the sheet's ghost row.

  The drop zone is a <label> around a hidden file input, which is what makes
  the whole dashed box a click target and a drop target without a line of
  script. Choosing a file posts it to the preview, which answers with the
  detail area below - the project's name and figures, or why the file is not
  one. Nothing is kept between that and Import: the file is uploaded again when
  the form is posted, which costs a second copy of a few kilobytes and saves a
  scratch file with an owner and a lifetime.

  The preview's swap lands inside this callout, and the folding engine places
  the callout again when it does, so the popover grows against its row rather
  than over it. It never touches the host itself. The drop zone's own words are
  changed out of band by the same response, because swapping the label would
  take the file input inside it - and the chosen file with it.

  Import stays pressable before a file has been described, unlike the mockup,
  where parsing was instant and local. Here it is a round trip, and a form
  whose only live control is Cancel until an invisible request comes back reads
  as broken - and with no JavaScript at all the preview never arrives, which
  would leave no way to import anything.
#}
{% from "macros/popover.html" import popover, popover_body %}
{% from "macros/sheet.html" import key %}

{% call popover("Import a project file") %}
  {% call popover_body("Import a project file") %}
    <form class="strip-form" method="post" action="{{ action }}"
          enctype="multipart/form-data" hx-encoding="multipart/form-data">
      {# The drop zone is this callout's first field, so it is where the
         engine puts the focus - every callout in the set has to say where
         that is, and the file input cannot be it: it is visually hidden, so
         its focus ring would be drawn a pixel wide in the corner of the
         sheet. The label is the whole dashed box and is the click target for
         the input already; tabindex makes it the keyboard target too. #}
      <label class="field field-wide bom-empty" tabindex="0" autofocus
             style="max-width:none;padding:var(--s-4);cursor:pointer">
        <span class="lead" id="import-lead" style="font-size:1rem">Drop a .pairrank file</span>
        <span class="cell-button">Choose file</span>
        <input class="visually-hidden" type="file" name="file" accept=".pairrank" required
               hx-post="{{ preview_url }}" hx-trigger="change"
               hx-target="#import-detail" hx-swap="outerHTML">
      </label>
      {% include "register/import_detail.html" %}
      <div class="strip-buttons">
        {# The ↵ legend has to be wired by hand. Nothing in the engine makes
           Enter mean Save: it presses whatever carries `data-sheet-key`, and
           this form has no text field for the browser's own implicit
           submission to work from - the only input in it is the file input,
           which is hidden. Without this the legend drew a key nothing
           pressed, and Enter fell through to a `sheet:open` no one listens
           for. #}
        <button class="cell-button is-primary" type="submit"
                data-sheet-key="Enter" aria-keyshortcuts="Enter">Import {{ key("↵") }}</button>
        <a class="cell-button" href="{{ cancel_url }}" data-sheet-key="Escape"
           aria-keyshortcuts="Escape">Cancel {{ key("Esc") }}</a>
      </div>
    </form>
  {% endcall %}
{% endcall %}
