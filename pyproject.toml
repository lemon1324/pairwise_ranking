[tool.poetry]
name = "pairwise-ranking"
version = "0.2.0"
description = "A PyQt6 GUI application for pairwise comparison ranking using Bradley-Terry model"
authors = ["lemon1324 <916812+lemon1324@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.0"

[tool.poetry.group.desktop.dependencies]
PyQt6 = "^6.6.0"

[tool.poetry.group.web.dependencies]
fastapi = "^0.141.0"
# Pinned explicitly although fastapi already depends on it: fastapi sets no
# upper bound, so without this a relock could carry starlette across a major
# version on its own. 1.x is the line that carries the DoS fixes.
starlette = "^1.6.0"
uvicorn = {extras = ["standard"], version = "^0.53.0"}
jinja2 = "^3.1.0"
# Not a caret: under Poetry's 0.0.x rule "^0.0.32" would mean <0.0.33, which
# pins this below every future fix. The advisories against 0.0.12 (DoS via a
# deformed multipart boundary, fixed in 0.0.18) are what this upload path
# would have shipped with.
python-multipart = ">=0.0.32,<1.0"
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
# The web route tests drive the app through FastAPI's TestClient, which is a
# thin wrapper over httpx and does not work without it. Nothing else in the
# suite needs a third-party package: the rest is still built-in unittest.
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pairwise-ranking = "main:main"
