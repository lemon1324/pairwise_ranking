[tool.poetry]
name = "pairwise-ranking"
version = "0.2.0"
description = "A PyQt6 GUI application for pairwise comparison ranking using Bradley-Terry model"
authors = ["lemon1324 <916812+lemon1324@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.0"

[tool.poetry.group.desktop.dependencies]
PyQt6 = "^6.6.0"

[tool.poetry.group.web.dependencies]
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
jinja2 = "^3.1.0"
python-multipart = "^0.0.12"
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
# No additional dev dependencies needed - using built-in unittest

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pairwise-ranking = "main:main"
